name: Playwright

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *" # nightly, catches changes on the target sites
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Publish the latest report from main (pushes and nightly runs) to GitHub Pages,
      # even when tests fail, so the failing run can be inspected in the browser.
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          path: playwright-report/

  publish-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
